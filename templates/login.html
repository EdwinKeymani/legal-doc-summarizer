<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Legal Document Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  {% include "_theme_init.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
  <script src="{{ url_for('static', filename='ui.js') }}" defer></script>
</head>
<body>

  <div class="container">
    {% include "_auth_brand_panel.html" %}

    <!-- Right Form -->
    <div class="form-panel">
      <div class="form-wrapper">
        <div class="form-header">
          <h2>Welcome Back</h2>
          <p>Enter your email and password to access your account</p>
        </div>

        {% include "_flash_messages.html" %}

        <form action="{{ url_for('login') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <input type="email" id="email" name="email" autocomplete="email" placeholder="Enter your email" required>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember">
              Remember me
            </label>
            <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot Password</a>
          </div>

          <button type="submit" class="btn-submit">Sign In</button>
        </form>
      </div>

      <div class="signup-text">
        Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a>
      </div>
    </div>
  </div>

</body>
</html>
