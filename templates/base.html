<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Legal Tech Suite{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --primary-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --border-color: #334155;
      --sidebar-width: 250px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* Vertical Sidebar for Desktop */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem 1rem;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
      text-decoration: none;
      margin-bottom: 2rem;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      list-style: none;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .nav-item:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--primary-green);
      color: #ffffff;
    }

    .user-actions {
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .btn-logout {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--danger);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px 12px;
    }

    /* Main Area for Desktop */
    .app-container {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 2rem;
      max-width: calc(100% - var(--sidebar-width));
    }

    /* Views visibility */
    .view-content { display: none; }
    .view-content.active { display: block; }

    /* Component Styles */
    .page-title { font-size: 1.5rem; margin-bottom: 1.5rem; }
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card-header { margin-bottom: 1rem; }
    .card-title { font-size: 1.1rem; font-weight: 600; }
    
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .metric-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .metric-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
    .metric-value { font-size: 1.8rem; font-weight: 700; margin: 0.5rem 0; }
    .metric-trend { font-size: 0.8rem; color: var(--text-muted); }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
    .data-table th { color: var(--text-muted); font-size: 0.85rem; }
    
    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-low { background-color: rgba(16, 185, 129, 0.2); color: var(--primary-green); }
    .status-medium { background-color: rgba(245, 158, 11, 0.2); color: #f59e0b; }

    .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label { font-size: 0.85rem; color: var(--text-muted); }
    .field-group select, .field-group input {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
    }

    .upload-box {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      margin-top: 1rem;
    }
    .file-input { display: none; }
    .uploaded-file-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-hover); padding: 8px 12px;
      border-radius: 6px; margin-top: 10px; width: fit-content;
    }

    .btn-submit-analysis {
      background-color: var(--primary-green);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7); display: none;
      justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-card {
      background: var(--bg-card); padding: 2rem; border-radius: 8px;
      max-width: 400px; width: 90%; border: 1px solid var(--border-color);
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem; }
    .btn-cancel { background: var(--bg-hover); color: var(--text-main); border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }

    /* Top Navigation bar on mobile screens (<= 768px) */
    @media (max-width: 768px) {
      .app-layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        position: sticky;
        top: 0;
        bottom: auto;
        left: auto;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        padding: 0.75rem 1rem;
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
      }

      .brand-logo {
        margin-bottom: 0;
      }

      .nav-list {
        flex-direction: row;
        width: 100%;
        order: 3;
        overflow-x: auto;
        padding-top: 8px;
        gap: 4px;
      }

      .nav-item {
        padding: 6px 12px;
        font-size: 0.85rem;
        white-space: nowrap;
      }

      .user-actions {
        padding-top: 0;
        border-top: none;
        order: 2;
      }

      .app-container {
        margin-left: 0;
        max-width: 100%;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar / Mobile Top Bar -->
    <aside class="sidebar">
      <div>
        <a href="#" class="brand-logo">
          <i class="fa-solid fa-scale-balanced" style="color: var(--primary-green);"></i>
          <span>Legal Tech Suite</span>
        </a>

        <ul class="nav-list">
          <li class="nav-item active" data-view="dashboard-view">
            <i class="fa-solid fa-chart-line"></i> Dashboard
          </li>
          <li class="nav-item" data-view="analyzer-view">
            <i class="fa-solid fa-microchip"></i> Analyzer
          </li>
          <li class="nav-item" data-view="documents-view">
            <i class="fa-solid fa-folder-open"></i> Repository
          </li>
          <li class="nav-item" data-view="settings-view">
            <i class="fa-solid fa-gear"></i> Settings
          </li>
        </ul>
      </div>

      <div class="user-actions">
        <a href="{{ url_for('logout') }}" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </div>
    </aside>

    <!-- Main View Container -->
    <main class="app-container">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Global Delete Confirmation Modal -->
  <div id="delete-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom: 10px;">Confirm Deletion</h3>
      <p id="delete-modal-text" style="color: var(--text-muted); font-size: 0.9rem;"></p>
      <div class="modal-actions">
        <button id="delete-cancel-btn" class="btn-cancel">Cancel</button>
        <button id="delete-confirm-btn" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
