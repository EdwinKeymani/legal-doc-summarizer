{# Favicons and home-screen icons. Included in the <head> of every page. #}
<link rel="icon" href="{{ url_for('static', filename='brand/favicon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ url_for('static', filename='brand/favicon.ico') }}" sizes="48x48">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='brand/apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='brand/site.webmanifest') }}">
<meta name="theme-color" content="#0f172a">
<meta name="application-name" content="{{ brand_name }}">
<meta name="description" content="{{ brand_name }}: {{ brand_tagline }} Contract summaries, risky clauses and key terms in one report.">
