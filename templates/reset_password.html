<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Legal Document Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  {% include "_theme_init.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
  <script src="{{ url_for('static', filename='ui.js') }}" defer></script>
</head>
<body>

  <div class="container">
    {% include "_auth_brand_panel.html" %}

    <div class="form-panel">
      <div class="form-wrapper">
        <div class="form-header">
          <h2>Set New Password</h2>
          <p>Enter a new password for your account</p>
        </div>

        {% include "_flash_messages.html" %}

        <form action="{{ url_for('reset_password', token=token) }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-group">
            <label for="new_password">New Password</label>
            <div class="input-wrapper">
              <input type="password" autocomplete="new-password" id="new_password" name="new_password" placeholder="Create a new password (min. 8 characters)" required minlength="8">
            </div>
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <div class="input-wrapper">
              <input type="password" autocomplete="new-password" id="confirm_password" name="confirm_password" placeholder="Confirm your new password" required minlength="8">
            </div>
          </div>

          <button type="submit" class="btn-submit">Reset Password</button>
        </form>
      </div>

      <div class="signup-text">
        Remembered your password? <a href="{{ url_for('login') }}">Sign In</a>
      </div>
    </div>
  </div>

</body>
</html>
